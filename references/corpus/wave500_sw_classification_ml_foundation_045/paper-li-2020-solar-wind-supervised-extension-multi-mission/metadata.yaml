methods:
  - "Exhaustive feature-subset enumeration over 13 candidate solar-wind parameters (2^13 - 1 = 8191 combinations); selects best 8-dimensional set: (B_T, N_p, T_p, V_p, N_alpha/N_p, T_exp/T_p, S_p, M_f)."

required_data:
  - Metis VL + UV imagery covering a candidate pseudostreamer outflow window
  - PFSS or analogous magnetic-topology model for the parent active region / coronal-hole pair
  - SolO context EUV (EUI, SPICE) for footpoint identification (optional but recommended)
methods:
  - Identify a pseudostreamer footpoint configuration in the PFSS topology
  - Track outflow brightness features in Metis imagery and extract apparent outflow speed v_⊥(t, r)
  - Compare outflow speed against the local Alfvén speed v_A from a coronal model
  - Cross-check footpoint position against EUI / SPICE coronal-hole / active-region boundary

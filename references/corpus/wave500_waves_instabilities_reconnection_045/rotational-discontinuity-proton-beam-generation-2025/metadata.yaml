required_data:
  - Hybrid-PIC code (e.g. dHybridR, CAMELIA) capable of evolving an isolated RD in a solar-wind-like background
  - PSP MAG + SPAN-i candidate RD event catalogue (boundary-jump, plasma-parameter, switchback-like criteria)
  - Linear-resonance condition evaluator for AW-particle interaction at the RD
methods:
  - Initialise a hybrid simulation with an RD configuration consistent with switchback-boundary-like jumps (Δθ_B, density continuous, normal-B continuous)
  - Evolve the RD in a solar-wind-like background and extract the downstream proton-beam drift v_b(t)
  - Evaluate the wave-particle resonance condition that the paper identifies for beam generation
  - Match v_b(t) to PSP RD-event beam observations under the same (Δθ_B, β, M_A) bin
  - Separate RD-driven beams from reconnection-exhaust beams using the jump-condition diagnostic
validation_targets:
  - Predicted beam drift v_b lies within the in-situ envelope on the paper's labelled PSP RD events (TODO_verify_with_full_text for exact band)
  - The simulation reproduces the (Δθ_B, β)-dependence of v_b shown in the paper's reference figure
  - The RD-vs-reconnection-exhaust discriminator (continuity of normal-B and density vs jump in tangential-B) classifies the paper's labelled events with ≲ 10 % error

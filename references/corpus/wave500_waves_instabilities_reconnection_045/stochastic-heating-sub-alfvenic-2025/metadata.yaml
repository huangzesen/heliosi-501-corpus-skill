required_data:
  - PSP MAG + SPC/SPAN-i high-cadence data for the identified sub-Alfvénic intervals (M_A < 1)
  - The Chandran-2010 stochastic-heating closure ([[chandran-2010-stochastic-heating-perp-alfven]])
  - Density estimate adequate for ρ_i inference at the relevant cadence
methods:
  - Identify sub-Alfvénic intervals via M_A = v_sw / v_A < 1 from PSP MAG + SPC
  - Estimate δv_⊥(ρ_i) from the perpendicular velocity / magnetic-field spectrum at the gyroscale
  - Evaluate Q_⊥ via the Chandran-2010 closure with (c_1, c_2) = (0.75, 0.34)
  - Compare Q_⊥ to an independent heating budget (turbulent cascade rate, observed T_⊥(r) evolution)
  - Report the Q_⊥-closure fraction per interval
validation_targets:
  - Q_⊥ closes a paper-stated fraction of the inferred perpendicular heating budget (TODO_verify_with_full_text for exact fraction)
  - ε = δv_⊥ / v_⊥,p sits in the calibration band (ε ∈ [0.05, 0.5]) for most analysed intervals; out-of-calibration fraction reported
  - Q_⊥(r) profile in the sub-Alfvénic regime reproduces the paper's reference-figure shape

required_data:
  - SolO RPW LFR/TDS spectral products covering candidate ion-acoustic-wave intervals
  - SolO SWA-PAS (proton) + SWA-EAS (electron) moments for (T_e, T_i, drift)
  - Linear-Vlasov dispersion solver for the IA branch with finite k λ_D
methods:
  - Identify ion-acoustic-wave intervals from SolO RPW spectral signatures
  - Assemble (T_e, T_i, v_drift) per interval from SWA-PAS + SWA-EAS
  - Solve the linear-Vlasov dispersion for the IA branch and emit γ(T_e/T_i, drift)
  - Classify each interval as damped (γ < 0) or unstable (γ > 0) and aggregate the population
  - Bonus: cross-check with the modulated-IAW ML detector for label consistency
validation_targets:
  - The damped / unstable split sits at the (T_e/T_i) threshold reported by the paper (TODO_verify_with_full_text for the exact threshold)
  - Recovery of the same event tags as the paper on the overlap subset to within ≲ 5 % count discrepancy
  - On a labelled ML-detected subset ([[paper-sasli-2026-ember-modulated-ion-acoustic-wave-ml]]), the linear-theory classifier and the ML detector agree on the dominant label

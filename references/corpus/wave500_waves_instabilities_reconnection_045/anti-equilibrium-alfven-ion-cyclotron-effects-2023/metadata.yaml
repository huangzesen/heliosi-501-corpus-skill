required_data:
  - In-situ VDF in distribution-function form (PSP SPAN-i or Wind/SWE/3DP)
  - Linear-Vlasov solver with arbitrary-VDF input (e.g. ALPS or LEOPARD)
  - Optional: bi-Maxwellian baseline fit for the same intervals
methods:
  - Solve the linear-Vlasov dispersion using the observed VDF as input
  - Solve the same dispersion using a bi-Maxwellian fit to the VDF as input
  - Emit γ_max(observed VDF) / γ_max(bi-Maxwellian fit) per interval
  - Aggregate to identify intervals where the bi-Maxwellian closure mis-calls AIC stability
validation_targets:
  - γ_max ratio reproduced on the paper's labelled events to within stated bars (TODO_verify_with_full_text for exact tolerance, paper §IV)
  - Sign of the bi-Maxwellian bias is reproduced (under-estimate when the observed VDF carries beams; over-estimate at certain anisotropy configurations)
  - The set of intervals reclassified by the free-form-VDF closure overlaps the paper's set within ≲ 10 % count discrepancy

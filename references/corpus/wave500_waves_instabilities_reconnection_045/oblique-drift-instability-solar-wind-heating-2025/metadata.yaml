required_data:
  - In-situ proton + alpha VDF (or proton + electron in the drift configuration of interest)
  - Linear-Vlasov solver with full (k_∥, k_⊥) coverage (e.g. ALPS, PLUME, NHDS)
  - Optional: hybrid-PIC code to verify nonlinear Q partition
methods:
  - Solve the linear-Vlasov dispersion in the (k_∥, k_⊥) plane for the observed drift VDF, scanning the oblique branch
  - Compare γ_max(oblique) to γ_max(parallel-only) for matched VDF parameters
  - Map intervals onto the (β_∥, Δv_pα / v_A) plane and overlay marginal-stability contours from the oblique-branch solver
  - Optional: run a hybrid simulation initialized at marginal stability to verify the heating-channel partition

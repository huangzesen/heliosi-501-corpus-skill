required_data:
  - Turbulence amplitude δv_⊥ at the proton-gyroscale ρ_i (from in-situ MAG/SPC or from a turbulence model)
  - Local proton thermal speed v_⊥ (or v_⊥,p ≈ v_th,p)
  - Local proton gyroradius ρ_i (from B and T_⊥,p)
methods:
  - Evaluate ε = δv_⊥(ρ_i)/v_⊥
  - Evaluate Q_⊥ = c_1 (δv_⊥)^3 / ρ_i · exp(−c_2/ε) with the paper's calibration (c_1 ≈ 0.75, c_2 ≈ 0.34 for randomly-phased AW turbulence)
  - Compare Q_⊥ against an independent heating budget (turbulent cascade, observed T_⊥(r) evolution)
validation_targets:
  - Reproduce Figure 3 Q_⊥(ε) curve shape: stochastic suppression for ε ≲ 0.1, near-power-law growth for ε ≳ 0.2
  - Recover the calibration c_1 ≈ 0.75, c_2 ≈ 0.34 when fitting the published test-particle dataset
  - Q_⊥ approaches the cascade rate ε_T ≈ ρ̄ (δv_⊥)^3/L_⊥ within stated bars when ε is order unity

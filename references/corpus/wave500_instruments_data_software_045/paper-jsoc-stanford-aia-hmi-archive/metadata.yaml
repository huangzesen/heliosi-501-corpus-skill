  - "Series naming reconciliation: a JSOC series name (e.g. hmi.M_45s) and the corresponding VSO query for the same product return the same FITS file body bit-identically (cross-archive parity)"
research_generation_affordances:
  - type: gap
    statement: "No single canonical 'JSOC paper'. The skill aggregates DRMS-backed series (aia.lev1, hmi.M_*, hmi.B_*, hmi.sharp_*, mdi.fd_M_*) and is anchored by AIA/HMI/MDI hardware papers + Couvidat et al. 2016 (HMI processing). The package is the de-facto SDO authority without a single citation surface."
    related_skills: ["paper-lemen-2012-sdo-aia-atmospheric-imaging-assembly", "paper-scherrer-2012-sdo-hmi-helioseismic-magnetic-imager", "paper-glogowski-2019-drms-jsoc-data-client"]
    proposed_action: "Treat the missing single citation as an immutable verification flag; cite the per-instrument hardware papers and Couvidat 2016 together, never silently fabricate a 'JSOC paper' citation."
  - type: tension
    statement: "VSO and CDAWeb mirror JSOC-exposed datasets but the series naming differs (e.g. hmi.M_45s on JSOC vs the VSO/sunpy.net.Fido conventions). A skill that defaults to one without verifying the other can silently load a different product."
    related_skills: ["paper-glogowski-2019-drms-jsoc-data-client"]
    proposed_action: "Add a series-name reconciliation table to adapter_notes of downstream SDO paper-skills; gate any VSO/JSOC switch on the reconciliation table."
  - type: minimal_experiment
    statement: "On a fixed AIA observation (e.g. 2017-09-06 X9.3 flare, 193 Å frame), download via JSOC drms and via VSO sunpy.net.Fido and diff the FITS bodies byte-by-byte. Expected: bit-identity; any divergence is a mirror-side calibration-version skew."
    related_skills: ["paper-glogowski-2019-drms-jsoc-data-client"]
    proposed_action: "Commit the JSOC vs VSO diff harness; treat persistent divergence as a blocker for promoting downstream SDO paper-skills past method-ready."
  - type: open_question
    statement: "How many JSOC series are internal-only vs externally exposed? The corpus has no automated probe — a paper-skill that depends on an internal-only series will fail silently at promotion."
    proposed_action: "Add a periodic discovery probe that enumerates jsoc_info series via the public DRMS API and diffs against the depends_on slugs in the corpus manifest; flag any depends_on series that is no longer publicly enumerable."
